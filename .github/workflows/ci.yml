name: CI and CD

on:
  push:
    branches:
      - main

jobs:
  test:
    name: formatting and testing
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.1'
      
      - name: Run go fmt and vet 
        run: go fmt ./... && go vet ./...
  
  build:
    name: Building docker image
    needs: test
    permissions:
      contents: read
      packages: write
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Экшен для автоматического создания правильных тегов в нижнем регистре
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  
  deploy:
    name: Deploy to Kubernetes
    needs: build
    
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'
        
      - name: Configure kubectl context
        uses: azure/k8s-set-context@v4
        with:
          method: service-account
          k8s-url: ${{ secrets.K8S_SERVER_URL }}
          k8s-secret: ${{ secrets.K8S_SECRET_YAML }}
        
      - name: Update deployment image and apply
        shell: powershell
        run: |
          # Преобразуем имя репозитория в нижний регистр для ghcr
          $repoLower = "${{ github.repository }}".ToLower()
          $image = "ghcr.io/${repoLower}:sha-${{ github.sha }}"

          kubectl apply -f k8s/deployment/deployment.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          kubectl set image deployment/my-app app=$image -n production
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          kubectl rollout status deployment/my-app -n production --timeout=120s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
