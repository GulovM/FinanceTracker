apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels: 
        app: my-app
    spec:
      containers:
        - name: app
          image: ghcr.io/gulovm/financetracker:sha-a6f8f0e
          ports: 
            - containerPort: 80