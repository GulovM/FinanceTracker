# Шаблон Secret с настройками приложения. Реальные значения в Git не коммитим:
# скопируйте файл вне репозитория, подставьте значения и примените вручную:
#   kubectl apply -f secret.yml
# или создайте Secret без файла:
#   kubectl create secret generic app-env -n production \
#     --from-literal=JWT_SECRET=... --from-literal=POSTGRES_USER=... \
#     --from-literal=POSTGRES_PASSWORD=... --from-literal=POSTGRES_DB=... \
#     --from-literal=DB_HOST=postgres.production.svc:5432
#
# PORT не задаём: Nginx в образе проксирует на 127.0.0.1:8080, это порт API по умолчанию.
apiVersion: v1
kind: Secret
metadata:
  name: app-env
  namespace: production
type: Opaque
stringData:
  JWT_SECRET: replace-with-a-long-random-secret
  POSTGRES_USER: finance_user
  POSTGRES_PASSWORD: change_me
  POSTGRES_DB: finance_tracker
  DB_HOST: postgres.production.svc:5432
